{{ define "main" }}
  <section class="hero">
    <p class="eyebrow">{{ site.Params.name }}'s knowledge base</p>
    <h1>{{ .Title }}</h1>
    <div class="lead">{{ .Content }}</div>
    <p><a href="{{ relURL "start-here/" }}">How to read these maps &rarr;</a></p>
  </section>
  <nav class="post-list" aria-label="Knowledge topics">
    {{ range where site.RegularPages.ByTitle "Params.canvas" "ne" nil }}
      <article>
        <p class="topic-type">Knowledge map</p>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Description }}</p>
      </article>
    {{ end }}
  </nav>
{{ end }}
